<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Preview</title>
<style>
/* Restore the pre-swatch dark green ramp with a modest increase in saturation. Light palette matches v2. */
:root{color-scheme:dark;--page:#1c1e1f;--panel:#23292d;--input:#191d20;--border:#3b454e;--text:#dce3e9;--title:#f1f5f7;--muted:#a8b5c1;--green:#7ac6a6;--blue:#79d2f4;--empty:#30383d;--l1:#40985b;--l2:#5dcc7b;--l3:#abf2b8;--search-focus:#b2bbc0;--search-active:#202528;--today-ink:#102934}
:root.light{color-scheme:light;--page:#f7fafc;--panel:#edf1f4;--input:#fff;--border:#c4ced7;--text:#24364b;--title:#132b43;--muted:#50657a;--green:#157657;--blue:#1670a0;--empty:#dce3e7;--l1:#b6d8c3;--l2:#72b38b;--l3:#278653;--search-focus:#1670a0;--today-ink:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:var(--text);border:1px solid var(--border);background:transparent;border-radius:8px;padding:8px 13px;min-height:40px}button:hover{background:var(--empty)}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button:disabled{opacity:.4;cursor:default}::selection{background:var(--blue);color:var(--today-ink)}main{max-width:1180px;margin:auto;padding:24px 28px 40px}.preview-tools{display:flex;justify-content:flex-end;margin-bottom:14px}.preview-tools button{min-height:32px;padding:4px 11px;font-size:12px;color:var(--muted)}.hero,.activity{border:1px solid var(--border);border-radius:16px;background:var(--panel)}.hero{padding:28px 30px}.search-wrap{position:relative}.search{display:flex;align-items:center;gap:14px;border:1px solid var(--border);background:var(--input);border-radius:9px;padding:0 17px;cursor:text}.search:focus-within{background:var(--search-active,var(--input));border-color:var(--search-focus);box-shadow:inset 0 0 0 1px var(--search-focus)}.search svg{width:21px;flex-shrink:0;color:var(--green)}.search input{width:100%;min-width:0;height:55px;border:0;border-radius:0;background:transparent;color:var(--title);outline:none;box-shadow:none}.search input:focus,.search input:focus-visible{background:transparent;outline:none;box-shadow:none}.search input{caret-color:var(--text)}.year{color:var(--green)}.search input::placeholder{color:var(--muted)}kbd{font:12px system-ui;border:1px solid var(--border);padding:2px 7px;border-radius:4px;color:var(--muted)}.results{position:absolute;top:65px;left:0;right:0;background:var(--input);border:1px solid var(--border);padding:8px;border-radius:9px;z-index:3}.results button{display:block;width:100%;text-align:left;border:0}.results p{padding:8px;margin:0;color:var(--muted)}.intro{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:40px;align-items:center;margin-top:32px}.date-block{padding:10px 0 22px}.weekday{margin:0 0 8px;color:var(--green);font-size:17px;font-weight:600}h1{margin:0;color:var(--title);font-size:clamp(34px,4.5vw,56px);font-weight:650;line-height:1.15;letter-spacing:-.03em}.calendar{border-left:1px solid var(--border);padding-left:28px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calendar-head strong{font-weight:600;color:var(--title)}.arrows{display:flex;gap:3px}.arrows button{padding:4px;min-height:30px;width:30px;border:0;display:grid;place-items:center}.arrows svg{width:16px;height:16px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}.week{color:var(--muted);font-size:11px;margin-bottom:6px}.days button{font-size:12px;border:1px solid transparent;padding:0;min-height:29px;border-radius:6px;font-variant-numeric:tabular-nums}.days .today{background:var(--blue);color:var(--today-ink);font-weight:700}.days .picked{border-color:var(--green)}.activity{padding:26px 30px;margin-top:22px}h2{margin:0;color:var(--title);font-size:20px;font-weight:650}.summary{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;margin:20px 0 27px;color:var(--muted);font-size:13px}.summary strong{color:var(--title);font-weight:650;font-size:24px;margin-right:7px;font-variant-numeric:tabular-nums}.summary span:first-child{margin-right:auto}.heat-scroll{overflow-x:auto;scrollbar-color:var(--border) var(--panel);padding:3px 2px 6px}.heat{min-width:790px;display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:20px auto;column-gap:10px;row-gap:7px}.months{position:relative;grid-column:2;color:var(--muted);font-size:11px}.months span{position:absolute}.row-labels{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:4px;color:var(--muted);font-size:10px;align-items:center}.cells{display:grid;grid-auto-flow:column;grid-template-columns:repeat(53,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:4px}.cells button{min-height:0;min-width:0;width:100%;aspect-ratio:1;padding:0;border:1px solid #ffffff07;border-radius:3px;background:var(--empty)}.cells button:hover{outline:1px solid var(--title);outline-offset:1px}.cells .l1,.swatch.l1{background:var(--l1)}.cells .l2,.swatch.l2{background:var(--l2)}.cells .l3,.swatch.l3{background:var(--l3)}.cells .future{visibility:hidden}.legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin:10px 0 0;color:var(--muted);font-size:11px}.legend span:first-child{margin-right:4px}.legend span:last-child{margin-left:4px}.swatch{display:inline-block;width:12px;height:12px;border:1px solid #ffffff07;border-radius:3px;background:var(--empty)}.detail{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--border);margin-top:19px;padding-top:15px;min-height:55px;font-size:13px}.detail p{margin:0}.detail strong{color:var(--title);font-weight:600}.detail small{display:block;color:var(--muted);margin-top:3px}.detail button{color:var(--blue);font-size:13px;white-space:nowrap}.status{color:var(--blue);font-size:13px;margin:14px 2px 0}.status:empty{display:none}[hidden]{display:none!important}@media(max-width:760px){main{padding:18px 16px}.hero,.activity{padding:22px}.intro{grid-template-columns:minmax(0,1fr) 250px;gap:20px}.calendar{padding-left:18px}.summary{gap:14px}.summary strong{font-size:21px}}@media(max-width:600px){.intro{grid-template-columns:1fr;gap:24px;margin-top:25px}.calendar{border-left:0;border-top:1px solid var(--border);padding:18px 0 0}.days button{min-height:35px;font-size:13px}.date-block{padding-bottom:5px}.hero,.activity{padding:20px}.search{padding:0 12px}kbd{display:none}.detail{align-items:flex-start}.summary{gap:10px 20px}.summary span:first-child{flex-basis:100%}.summary strong{font-size:22px}}
</style>
</head>
<body>
<main>
<div class="preview-tools"><button id="theme" type="button" aria-label="Switch preview to light mode">Light mode</button></div>
<section class="hero" aria-label="Daily overview">
<div class="search-wrap"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" autocomplete="off" placeholder="Search files in your vault…" aria-label="Search sample files" aria-controls="results" aria-expanded="false"><kbd>Enter</kbd></label><div id="results" class="results" hidden></div></div>
<div class="intro"><div class="date-block"><p class="weekday">Monday</p><h1>Oct 26, <span class="year">2026</span></h1></div>
<section class="calendar" aria-label="Monthly calendar"><div class="calendar-head"><strong id="month"></strong><div class="arrows"><button id="prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button id="next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></div><div class="week" aria-hidden="true"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div id="days" class="days"></div></section></div>
</section>
<section class="activity" aria-label="Daily note activity"><h2>Activity Signal</h2><p id="summary" class="summary"></p><div class="heat-scroll"><div class="heat"><div class="months" id="months"></div><div class="row-labels" aria-hidden="true"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div><div class="cells" id="cells" aria-label="Daily activity heatmap"></div></div></div><div class="legend" aria-label="Activity levels"><span>Less</span><i class="swatch" title="No daily note"></i><i class="swatch l1" title="Daily note exists"></i><i class="swatch l2" title="Deep work: at least 60 minutes"></i><i class="swatch l3" title="Wins recorded"></i><span>More</span></div><div class="detail" id="detail" hidden><p><strong id="detail-title"></strong><small id="detail-body"></small></p><button id="open">Open daily</button></div></section>
<p class="status" id="status" role="status"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const today=new Date(2026,9,26,12),start=new Date(2025,9,26,12),data=new Map();
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
let selected=key(today),shown=new Date(2026,9,1,12);
const points=[];
for(let i=0;i<371;i++){
 const d=new Date(start);d.setDate(d.getDate()+i);const date=key(d),future=d>today;
 const seed=(i*17+Math.floor(i/7)*11)%29,exists=!future&&seed>5;
 const deep=exists?(seed*13)%151:0,wins=exists&&seed%4===0?'Finished the most important task of the day.':'';
 const item=date===key(today)?{date,exists:true,deep:90,wins:'Completed a focused study session.',level:3,future:false}:{date,exists,deep,wins,level:exists?(wins?3:deep>=60?2:1):0,future};
 data.set(date,item);points.push(item);
 if(d.getDate()<=7&&d.getDay()===0){const m=document.createElement('span');m.textContent=monthNames[d.getMonth()].slice(0,3);m.style.left=`${Math.floor(i/7)/53*100}%`;$('months').append(m)}
 const b=document.createElement('button');b.className=item.future?'future':`l${item.level}`;b.disabled=item.future;b.title=`${date} · ${item.future?'Future date':item.exists?`Level ${item.level} · ${item.deep} min deep work${item.wins?' · Wins recorded':''}`:'No daily note'}`;b.setAttribute('aria-label',b.title);b.onclick=()=>choose(date);$('cells').append(b);
}
$('summary').innerHTML=`<span><strong>${points.filter(x=>x.exists).length}</strong> active days in this view</span><span><strong>${points.filter(x=>x.deep>=60).length}</strong> deep work days</span><span><strong>${points.filter(x=>x.wins).length}</strong> days with wins</span>`;
function choose(date){selected=date;const item=data.get(date);$('detail').hidden=false;$('detail-title').textContent=date;$('detail-body').textContent=item?.exists?`${item.deep} min deep work · ${item.wins?`Wins: ${item.wins}`:'No wins recorded'} · Level ${item.level}`:'No daily note for this date.';$('open').disabled=!item?.exists;renderCalendar()}
function renderCalendar(){
 $('month').textContent=monthNames[shown.getMonth()]+' ';const year=document.createElement('span');year.className='year';year.textContent=shown.getFullYear();$('month').append(year);$('days').replaceChildren();
 const offset=(shown.getDay()+6)%7,total=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();
 for(let i=0;i<offset;i++)$('days').append(document.createElement('span'));
 for(let n=1;n<=total;n++){const d=new Date(shown.getFullYear(),shown.getMonth(),n,12),k=key(d),b=document.createElement('button');b.textContent=n;b.setAttribute('aria-label',k);b.setAttribute('aria-pressed',String(k===selected));if(k===key(today))b.classList.add('today');if(k===selected)b.classList.add('picked');b.onclick=()=>choose(k);$('days').append(b)}
}
$('prev').onclick=()=>{shown.setMonth(shown.getMonth()-1);renderCalendar()};$('next').onclick=()=>{shown.setMonth(shown.getMonth()+1);renderCalendar()};
$('theme').onclick=()=>{const light=document.documentElement.classList.toggle('light');$('theme').textContent=light?'Dark mode':'Light mode';$('theme').setAttribute('aria-label',`Switch preview to ${light?'dark':'light'} mode`)};
function simulate(path){$('status').textContent=`Preview only — would open ${path}. No vault is connected.`}
$('open').onclick=()=>simulate(`Daily/${selected}.md`);
const files=['Daily/2026-10-26.md','Daily/2026-10-25.md','Study/Note-taking methods.md','Ideas/Obsidian Dashboard.md','Eisenhower Tasks.md'];
$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLocaleLowerCase('en');$('results').replaceChildren();$('results').hidden=!q;$('search').setAttribute('aria-expanded',String(!!q));if(!q)return;const matches=files.filter(p=>p.toLocaleLowerCase('en').includes(q));if(!matches.length){const p=document.createElement('p');p.textContent='No matching sample files.';$('results').append(p)}for(const path of matches){const b=document.createElement('button');b.textContent=path;b.onclick=()=>{simulate(path);$('results').hidden=true;$('search').setAttribute('aria-expanded','false')};$('results').append(b)}});
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')$('results').querySelector('button')?.click();if(e.key==='Escape'){$('results').hidden=true;$('search').setAttribute('aria-expanded','false')}});
renderCalendar();
</script>
</body>
</html>
